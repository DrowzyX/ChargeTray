name: Build ChargeTray (Windows)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run protocol tests
        shell: pwsh
        run: dotnet run --project tests/BatteryLogic.Tests.csproj -c Release
      - name: Restore and publish
        shell: pwsh
        run: dotnet publish src/ChargeTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ChargeTray-2.2.3-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeTray-2.2.3-win-x64
          path: ChargeTray-2.2.3-win-x64.zip
